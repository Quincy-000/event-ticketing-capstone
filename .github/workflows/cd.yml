# set the CD_ROLE_ARN repository variable after terraform apply (output cd_role_arn)
name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Debug OIDC token claims (remove after fix)
        run: |
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          python3 -c "
          import base64, sys
          p = sys.argv[1]
          p += '=' * (-len(p) % 4)
          print(base64.urlsafe_b64decode(p).decode())
          " "$PAYLOAD"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CD_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform apply (infra + Lambda code)
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -no-color

      - name: Sync frontend
        run: aws s3 sync frontend/ s3://event-ticketing-frontend-quincy-000 --delete
