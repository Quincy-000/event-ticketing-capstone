<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Ticketing — Serverless Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #64748b;
    --cyan: #22d3ee;
    --emerald: #34d399;
    --amber: #fbbf24;
    --rose: #fb7185;
    --violet: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(rgba(30,41,59,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,41,59,0.35) 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .container { max-width: 1080px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .brand p { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .api-badge {
    font-size: 10px; color: var(--emerald); border: 1px solid rgba(52,211,153,0.4);
    background: rgba(6,78,59,0.3); padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px;
  }
  .api-badge span { color: var(--muted); }

  /* Auth chip */
  .auth-chip {
    display: flex; align-items: center; gap: 8px; font-size: 11px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px;
  }
  .auth-chip .chip-email { color: var(--cyan); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auth-chip a, .auth-btn {
    font-family: inherit; font-size: 11px; font-weight: 700; color: var(--emerald);
    background: none; border: none; cursor: pointer; text-decoration: none; padding: 0;
  }
  .auth-chip a:hover, .auth-btn:hover { text-decoration: underline; }
  .auth-chip .sep { color: var(--border); }

  /* Section headers */
  .section { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
  .section .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.emerald { background: var(--emerald); } .dot.amber { background: var(--amber); } .dot.cyan { background: var(--cyan); }
  .section h2 { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #f8fafc; }
  .section .count { font-size: 10px; color: var(--dim); }

  /* Event cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 10px; transition: transform 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-2px); border-color: #334155; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .card .date { font-size: 10px; color: var(--dim); margin-top: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .badge .bdot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.available { color: var(--emerald); background: rgba(6,78,59,0.3); border: 1px solid rgba(52,211,153,0.4); }
  .badge.available .bdot { background: var(--emerald); }
  .badge.limited { color: var(--amber); background: rgba(120,53,15,0.25); border: 1px solid rgba(251,191,36,0.4); }
  .badge.limited .bdot { background: var(--amber); }
  .badge.full { color: var(--rose); background: rgba(136,19,55,0.25); border: 1px solid rgba(251,113,133,0.4); }
  .badge.full .bdot { background: var(--rose); }
  .capacity-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); }
  .capacity-label b { color: var(--muted); font-weight: 500; }
  .bar { height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .fill-available { background: linear-gradient(90deg, var(--emerald), #6ee7b7); }
  .fill-limited { background: linear-gradient(90deg, var(--amber), #fde047); }
  .fill-full { background: linear-gradient(90deg, var(--rose), #fda4af); }
  .btn {
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--border); background: var(--panel); color: var(--dim); }
  .btn-primary { background: var(--emerald); color: #022c22; }
  .btn-primary:hover:not(:disabled) { background: #6ee7b7; }
  .btn-ghost { background: transparent; color: var(--rose); border-color: rgba(251,113,133,0.4); }
  .btn-ghost:hover:not(:disabled) { background: rgba(136,19,55,0.25); }
  .btn-danger { background: transparent; color: var(--rose); border: 1px solid rgba(251,113,133,0.5); }
  .btn-danger:hover:not(:disabled) { background: rgba(136,19,55,0.3); }
  .card-actions { display: flex; gap: 8px; align-items: center; }
  .card-actions .btn { flex: 1; }

  /* Registrations list */
  .regs { display: flex; flex-direction: column; gap: 10px; }
  .reg {
    display: flex; justify-content: space-between; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; gap: 12px;
  }
  .reg .reg-main { min-width: 0; }
  .reg .reg-event { font-size: 13px; font-weight: 700; }
  .reg .reg-meta { font-size: 10px; color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reg .status-chip { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--emerald); border: 1px solid rgba(52,211,153,0.4); padding: 3px 8px; border-radius: 12px; }
  .reg .btn { padding: 7px 12px; }

  .empty { text-align: center; color: var(--dim); font-size: 12px; padding: 30px 0; border: 1px dashed var(--border); border-radius: 12px; }
  .empty b { color: var(--muted); }

  /* Toasts */
  .toasts { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--cyan);
    padding: 12px 16px; border-radius: 10px; font-size: 12px; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    animation: slideIn 0.25s ease; display: flex; align-items: center; gap: 10px;
  }
  .toast.success { border-left-color: var(--emerald); }
  .toast.error { border-left-color: var(--rose); }
  .toast.info { border-left-color: var(--cyan); }
  .toast.warn { border-left-color: var(--amber); }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast.out { animation: slideOut 0.25s ease forwards; }
  @keyframes slideOut { to { transform: translateX(30px); opacity: 0; } }

  footer { margin-top: 40px; text-align: center; font-size: 10px; color: var(--dim); }
  footer a { color: var(--cyan); text-decoration: none; }
  .loading { text-align: center; color: var(--dim); font-size: 12px; padding: 30px 0; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>Event Ticketing</h1>
        <p>Serverless registration · API Gateway → Lambda → DynamoDB</p>
      </div>
    </div>
    <div class="header-right">
      <div class="api-badge">API <span id="api-status">checking…</span></div>
      <div class="auth-chip" id="auth-chip"></div>
    </div>
  </header>

  <div class="section">
    <div class="dot emerald"></div>
    <h2>Upcoming Events</h2>
    <span class="count" id="events-count"></span>
  </div>
  <div class="grid" id="events"></div>

  <div class="section">
    <div class="dot cyan"></div>
    <h2>My Registrations</h2>
    <span class="count" id="regs-count"></span>
  </div>
  <div id="regs" class="regs"></div>

  <footer>
    <a href="https://github.com/Quincy-000/event-ticketing-capstone" target="_blank">github.com/Quincy-000/event-ticketing-capstone</a>
    &nbsp;·&nbsp; Azubi Africa AWS capstone · static frontend on S3
  </footer>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = "https://qhmocsswo9.execute-api.us-east-1.amazonaws.com/dev";

const CONFIG = {
  COGNITO_DOMAIN: "https://event-ticketing-quincy000.auth.us-east-1.amazoncognito.com",
  CLIENT_ID: "6m8d1fppj6a9cak7gst2us3no8",
  REDIRECT_URI: window.location.origin,
};

const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("et-token") || "";
let email = localStorage.getItem("et-email") || "";
let eventMap = {};
let myRegs = {}; // eventId -> registrationId (this user's confirmed registrations)

// ---------- auth ----------
function loginUrl() {
  return `${CONFIG.COGNITO_DOMAIN}/login?client_id=${CONFIG.CLIENT_ID}&response_type=token&scope=openid+email+profile&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}`;
}
function logoutUrl() {
  return `${CONFIG.COGNITO_DOMAIN}/logout?client_id=${CONFIG.CLIENT_ID}&logout_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}`;
}

function parseHash() {
  if (!location.hash.includes("id_token")) return;
  const params = new URLSearchParams(location.hash.slice(1));
  const idToken = params.get("id_token");
  if (!idToken) return;
  try {
    // Cognito id_tokens are unpadded base64url — atob() needs padding restored.
    const b64 = idToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    const payload = JSON.parse(atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4)));
    token = idToken;
    email = payload.email || "";
    localStorage.setItem("et-token", token);
    localStorage.setItem("et-email", email);
  } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
}

function signOut() {
  localStorage.removeItem("et-token");
  localStorage.removeItem("et-email");
  token = ""; email = "";
  location.href = logoutUrl();
}

function renderAuthChip() {
  const chip = $("auth-chip");
  if (token && email) {
    chip.innerHTML = `<span class="chip-email">Signed in as ${esc(email)}</span><span class="sep">|</span><button class="auth-btn" onclick="signOut()">Sign out</button>`;
  } else {
    chip.innerHTML = `<a href="${loginUrl()}">Sign in</a>`;
  }
}

// ---------- toasts ----------
function toast(msg, type = "info") {
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 250); }, 3800);
}

// ---------- fetch helpers ----------
async function api(path, opts = {}) {
  if (token) {
    opts.headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
  }
  const res = await fetch(API + path, opts);
  let body = {};
  try { body = await res.json(); } catch (e) {}
  return { status: res.status, body };
}

async function checkApi() {
  try {
    const res = await fetch(API + "/events");
    const status = res.status;
    $("api-status").textContent = status === 200 ? "connected ✓" : "error (" + status + ")";
    $("api-status").style.color = status === 200 ? "#34d399" : "#fb7185";
  } catch (e) {
    $("api-status").textContent = "unreachable ✗";
    $("api-status").style.color = "#fb7185";
  }
}

// ---------- rendering ----------
function statusClass(s) { return String(s || "").toLowerCase(); }
function fillClass(s) {
  const c = statusClass(s);
  return c === "full" ? "fill-full" : c === "limited" ? "fill-limited" : "fill-available";
}

function renderEvents(events) {
  eventMap = {};
  events.forEach(e => eventMap[e.eventId] = e);
  $("events-count").textContent = events.length + " shown";
  const grid = $("events");
  if (!events.length) {
    grid.innerHTML = `<div class="empty"><b>No events yet.</b><br>Deploy, then run <code>python seed.py</code> to populate the table.</div>`;
    return;
  }
  const signedIn = !!(token && email);
  grid.innerHTML = events.map(e => {
    const pct = Math.min(100, Math.round((e.registeredCount / e.totalCapacity) * 100));
    const isFull = statusClass(e.status) === "full";
    const regId = myRegs[e.eventId];
    const registered = !!regId;
    const disabled = (isFull || !signedIn) ? "disabled" : "";
    const title = !signedIn ? `title="Sign in to register"` : "";
    const actions = registered
      ? `<div class="card-actions">
          <button class="btn btn-primary" disabled title="Registered">Registered ✓</button>
          <button class="btn btn-danger" onclick="cancel('${regId}', '${esc(e.eventName)}')">Cancel</button>
        </div>`
      : `<div class="card-actions">
          <button class="btn btn-primary" ${disabled} ${title} onclick="register('${e.eventId}')">Register</button>
        </div>`;
    return `
    <div class="card">
      <div class="card-top">
        <div>
          <h3>${esc(e.eventName)}</h3>
          <div class="date">${esc(e.eventDate)}</div>
        </div>
        <span class="badge ${statusClass(e.status)}"><span class="bdot"></span>${esc(e.status)}</span>
      </div>
      <div class="capacity-label">
        <span>capacity</span><b>${e.registeredCount} / ${e.totalCapacity} booked</b>
      </div>
      <div class="bar"><div class="bar-fill ${fillClass(e.status)}" style="width:${pct}%"></div></div>
      ${actions}
    </div>`;
  }).join("");
}

function renderRegs(regs) {
  $("regs-count").textContent = regs.length + " total";
  const el = $("regs");
  if (!regs.length) {
    el.innerHTML = `<div class="empty">No confirmed registrations for this email.</div>`;
    return;
  }
  el.innerHTML = regs.map(r => {
    const ev = eventMap[r.eventId] || {};
    return `
    <div class="reg">
      <div class="reg-main">
        <div class="reg-event">${esc(ev.eventName || r.eventId)}</div>
        <div class="reg-meta">${esc(r.registrationId)} · ${esc(r.registeredAt || "")}</div>
      </div>
      <span class="status-chip">${esc(r.status)}</span>
      <button class="btn btn-ghost" onclick="cancel('${r.registrationId}', '${esc(ev.eventName || r.eventId)}')">Cancel</button>
    </div>`;
  }).join("");
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------- actions ----------
async function refresh() {
  const { status, body } = await fetch(API + "/events").then(async r => ({ status: r.status, body: await r.json().catch(() => ({})) }));
  if (status === 200) renderEvents(body.events || []);
  else toast("Failed to load events (" + status + ")", "error");
  if (token && email) loadRegs();
  else {
    $("regs-count").textContent = "";
    $("regs").innerHTML = `<div class="empty">Sign in to see your tickets.</div>`;
  }
}

async function loadRegs(retries = 2) {
  const enc = encodeURIComponent(email);
  const { status, body } = await api("/registrations/" + enc);
  if (status === 200 && (!body.registrations || body.registrations.length === 0) && retries > 0) {
    setTimeout(() => loadRegs(retries - 1), 800);
    return;
  }
  if (status === 200) {
    myRegs = {};
    (body.registrations || []).forEach(r => { myRegs[r.eventId] = r.registrationId; });
    renderRegs(body.registrations || []);
    // re-render event cards so registered events show the red Cancel button
    renderEvents(Object.values(eventMap));
  }
}

async function register(eventId) {
  if (!token || !email) { toast("Sign in first", "warn"); return; }
  const ev = eventMap[eventId] || {};
  const { status, body } = await api("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ eventId, email }),
  });
  if (status === 201) {
    toast(`Registered for "${ev.eventName || eventId}" ✓`, "success");
    refresh();
  } else if (status === 409) {
    toast(body.error || "Registration rejected", "error");
    refresh();
  } else {
    toast("Something went wrong (" + status + ")", "error");
  }
}

async function cancel(regId, name) {
  if (!token || !email) { toast("Sign in first", "warn"); return; }
  const { status, body } = await api("/registration/" + regId, { method: "DELETE" });
  if (status === 200) {
    toast(`Cancelled "${name}" — seat returned to the pool`, "success");
  } else if (status === 409) {
    toast(body.error || "Already cancelled", "warn");
  } else {
    toast("Failed to cancel (" + status + ")", "error");
  }
  refresh();
}

// ---------- init ----------
parseHash();
renderAuthChip();
checkApi();
refresh();
</script>
</body>
</html>
